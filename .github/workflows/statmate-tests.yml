name: StatMate tests

permissions:
  contents: read

on:
  push:
    paths:
      - "statmate/**"
      - "examples/heart-failure-survival/v2_demo/**"
      - ".github/workflows/statmate-tests.yml"
  pull_request:
    paths:
      - "statmate/**"
      - "examples/heart-failure-survival/v2_demo/**"
      - ".github/workflows/statmate-tests.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r statmate/requirements-test.txt
      - name: Run StatMate tests
        run: python -m pytest --disable-plugin-autoload -p no:cacheprovider statmate/tests -q
